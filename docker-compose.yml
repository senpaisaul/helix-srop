services:
  helix:
    build: .
    image: helix-srop:dev
    container_name: helix-srop
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - helix-data:/data
      - ./docs:/app/docs:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  helix-data:
